
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Property Website</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #007BFF; color: white; padding: 10px; text-align: center; }
    .container { display: flex; flex-wrap: wrap; padding: 10px; justify-content: center; }
    .property { border: 1px solid #ddd; border-radius: 8px; margin: 10px; width: 300px; overflow: hidden; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    .property img { width: 100%; height: 200px; object-fit: cover; }
    .property p { padding: 10px; margin: 0; }
    form { padding: 20px; background: #f9f9f9; }
  </style>
</head>
<body>
  <header>
    <h1>Available Properties</h1>
  </header>
  <div class="container">
    <div class="property">
      <a href="property1.html">
        <img src="house1.jpg" alt="House in Delhi">
        <p>3BHK in Delhi – ₹65 Lakhs</p>
      </a>
    </div>
    <div class="property">
      <a href="property2.html">
        <img src="house2.jpg" alt="Flat in Mumbai">
        <p>2BHK in Mumbai – ₹85 Lakhs</p>
      </a>
    </div>
  </div>
  <form>
    <h2>Contact Us</h2>
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>
    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>
    <label>Message:</label><br>
    <textarea name="message" rows="4" cols="40" required></textarea><br><br>
    <input type="submit" value="Send">
  </form>
</body>
</html>
